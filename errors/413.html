<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ff0000">
    <title>Upload too large - BAN</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=optional">
    <style>
        :root {
            --ban-red: #e53935;
            --bg: #f8f8f8;
            --surface: #ffffff;
            --text: #000000;
            --text-dim: #5b6270;
            --border: rgba(0,0,0,0.12);
            --link: dodgerblue;
            --accent-muted: rgba(85,158,255,0.08);
        }
        :root.dark {
            --bg: #161616;
            --surface: #181b20;
            --text: #dddddd;
            --text-dim: #8a929e;
            --border: rgba(255,255,255,0.12);
            --link: #f2f2ff;
            --accent-muted: rgba(91,141,239,0.12);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            background: var(--bg);
            color: var(--text);
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            line-height: 1.5;
        }
        main {
            width: 100%;
            max-width: 480px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 32px 28px;
        }
        .brand {
            display: inline-block;
            margin-bottom: 24px;
            color: inherit;
            text-decoration: none;
        }
        .brand span {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: -0.04em;
        }
        .brand .ban { color: var(--ban-red); }
        .code {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-dim);
        }
        h1 { font-size: 22px; margin: 4px 0 12px; letter-spacing: -0.02em; }
        p { margin: 0 0 12px; color: var(--text-dim); }
        ul { margin: 0 0 12px; padding-left: 20px; color: var(--text-dim); }
        li { margin-bottom: 4px; }
        .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 24px; }
        .actions a {
            padding: 8px 16px;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--link);
            text-decoration: none;
            font-weight: 500;
        }
        .actions a:first-child { background: var(--accent-muted); }
        .actions a:hover { border-color: var(--link); }
    </style>
    <script>
        (function () {
            try {
                var v = localStorage.getItem('theme');
                var dark = v === 'dark' || (v !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) {}
        })();
    </script>
</head>
<body>
<main>
    <a class="brand" href="/">
        <span>MTG<span class="ban">BAN</span></span>
    </a>
    <div class="code">Error 413</div>
    <h1>This upload is too large</h1>
    <p>Please try keeping the file below 10&nbsp;MB.</p>
    <ul>
        <li>Split the list into smaller files.</li>
        <li>Save it as CSV rather than a spreadsheet.</li>
        <li>Paste the list as text, or link a Google Sheet.</li>
    </ul>
    <div class="actions">
        <a href="/" onclick="if (history.length > 1) { history.back(); return false; }">Go back</a>
        <a href="/">Home</a>
    </div>
</main>
</body>
</html>
