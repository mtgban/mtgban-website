openapi: 3.0.0
info:
  title: BAN Price API
  version: 2.0.0
  description: >-
    Retail and buylist prices for singles and sealed products across many
    stores, by finish and by condition.

servers:
  - url: https://api.mtgban.com/v2/{game}
    variables:
      game:
        default: magic
        description: A game on your plan, as listed by https://api.mtgban.com/v2/games.json

security:
  - bearer: []
  - keyQuery: []

paths:
  /sets.json:
    get:
      summary: Set codes with data
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Array of set codes
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  /stores.json:
    get:
      summary: The stores the key can read, and what each one is
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Sellers and vendors, each sorted by shorthand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stores" }
        default: { $ref: "#/components/responses/Error" }

  /finishes.json:
    get:
      summary: The finishes prices are keyed by, commonest first
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Finish keys with a display name and a count
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Finish" } }
        default: { $ref: "#/components/responses/Error" }

  /{mode}/{setOrId}.json:
    get:
      summary: Prices for one edition or one card
      description: >-
        setOrId is a set code for an edition snapshot, or a card id
        (MTGBAN, MTGJSON, Scryfall, or TCGplayer) for a single card.
        Replace .json with .csv for the version 1 CSV.
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist, all, sealed] }
        - name: setOrId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/vendor"
        - $ref: "#/components/parameters/finish"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /search/{mode}/{query}.json:
    get:
      summary: Prices for every card matching a search
      description: >-
        Up to 9,999 cards. Replace .json with .csv for the version 1
        CSV, whose X-MTGBAN-Cut header, when present, counts the matching
        cards it leaves out.
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist] }
        - name: query
          in: path
          required: true
          description: Search text in the site syntax
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /search/{mode}/sealed/{query}.json:
    get:
      summary: Prices for every sealed product matching a search
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist] }
        - name: query
          in: path
          required: true
          description: Search text in the site syntax
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /newspaper/reports.json:
    get:
      summary: The newspaper's reports for the game, and what each one takes
      description: >-
        The reports in the newspaper's order, each with its columns, the
        filters it accepts and the values they take. A report not shown
        on this game is left out (combined_spike_score and the two
        buylist reports are Magic's alone); one not loaded yet, or whose
        query found no rows, is listed with rows 0 and empty sets and
        finishes. Takes no options: any query parameter is ignored. Needs
        the newspaper mode: 403 without it, 503 with Retry-After while no
        report has loaded (startup, or no newspaper on the host). Errors
        carry their HTTP status.
      responses:
        "200": { $ref: "#/components/responses/NewspaperReports" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /newspaper/{report}.json:
    get:
      summary: One newspaper report's latest edition, filtered, sorted and paged
      description: >-
        The ranked report, filtered and sorted, 1,000 rows a page; meta
        carries page, pages and the rows matched. An option the report
        does not list under filters in reports.json is a 400, as is a
        value outside the lists it gives, a bound that is not a finite
        number, a dir other than asc or desc, a sort on a column that is not
        sortable, or a page out of range; so is a report reports.json
        does not list. A report it lists whose query has never succeeded
        is a 503, report not loaded yet, with Retry-After: 300; one whose
        query ran and found no rows is a 200 with rows: [] and no date. A
        row with no value in a bound's column fails the bound. A filter
        that matches nothing answers rows: []. Replace .json with .csv for
        the same rows as a table. Needs the newspaper mode.
      parameters:
        - $ref: "#/components/parameters/report"
        - $ref: "#/components/parameters/newsSort"
        - $ref: "#/components/parameters/newsDir"
        - $ref: "#/components/parameters/newsPage"
        - $ref: "#/components/parameters/newsSet"
        - $ref: "#/components/parameters/newsRarity"
        - $ref: "#/components/parameters/newsFinish"
        - $ref: "#/components/parameters/newsBucket"
        - $ref: "#/components/parameters/minPrice"
        - $ref: "#/components/parameters/maxPrice"
        - $ref: "#/components/parameters/minChange"
        - $ref: "#/components/parameters/maxChange"
      responses:
        "200": { $ref: "#/components/responses/NewspaperReport" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /newspaper/{report}.csv:
    get:
      summary: One newspaper report's latest edition as CSV
      description: >-
        The rows of /newspaper/{report}.json as a table, with its options,
        paging and refusals. Errors stay JSON.
      parameters:
        - $ref: "#/components/parameters/report"
        - $ref: "#/components/parameters/newsSort"
        - $ref: "#/components/parameters/newsDir"
        - $ref: "#/components/parameters/newsPage"
        - $ref: "#/components/parameters/newsSet"
        - $ref: "#/components/parameters/newsRarity"
        - $ref: "#/components/parameters/newsFinish"
        - $ref: "#/components/parameters/newsBucket"
        - $ref: "#/components/parameters/minPrice"
        - $ref: "#/components/parameters/maxPrice"
        - $ref: "#/components/parameters/minChange"
        - $ref: "#/components/parameters/maxChange"
      responses:
        "200": { $ref: "#/components/responses/NewspaperCSV" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /history/{idsOrSet}.json:
    get:
      summary: Daily price history for cards or a page of a set
      description: >-
        idsOrSet is a set code for the set's singles, served in pages; a
        card id (MTGBAN, MTGJSON, Scryfall, or TCGplayer) for one printing
        in every finish; or a comma-separated list of card ids, with no
        spaces, for a batch. A single segment is tried as a set code
        first; a list with a comma is always a batch. Each id resolves to
        its printing's finishes and finish twins, and the distinct cards a
        batch covers, a card being one printing in one finish, count
        against the budget for the range. One id is always served. A
        printing has usually one to three finishes, so more than three ids
        per card allowed is a 400 before any resolves. Unknown ids are
        skipped; a batch of nothing but unknown ids is a 404. Needs
        the history mode. Replace .json with .csv for the same points as a
        flat table. Errors carry their HTTP status, unlike the price
        endpoints' 200 with an error body.
      parameters:
        - $ref: "#/components/parameters/idsOrSet"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/History" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /history/{idsOrSet}.csv:
    get:
      summary: Daily price history for cards or a page of a set, as CSV
      description: >-
        The forms and limits of /history/{idsOrSet}.json, one row per
        point. Errors stay JSON.
      parameters:
        - $ref: "#/components/parameters/idsOrSet"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/HistoryCSV" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /history/sealed/{set}.json:
    get:
      summary: Daily price history for a set's sealed products, in pages
      parameters:
        - $ref: "#/components/parameters/set"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/History" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

  /history/sealed/{set}.csv:
    get:
      summary: Daily price history for a set's sealed products, in pages, as CSV
      parameters:
        - $ref: "#/components/parameters/set"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/HistoryCSV" }
        "304": { description: "Not modified: If-None-Match holds the ETag" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Authorization Bearer ban_live_... or ban_demo_...
    keyQuery:
      type: apiKey
      in: query
      name: key
      description: For tools that cannot set headers; the key lands in logs

  parameters:
    id:
      name: id
      in: query
      description: Id system for card keys
      schema: { type: string, enum: [ban, tcg, scryfall, mtgjson, mkm, ck, name] }
    vendor:
      name: vendor
      in: query
      description: Comma-separated store tags
      schema: { type: string }
    finish:
      name: finish
      in: query
      description: >-
        Comma-separated finishes, spelled as the finish keys. Singles only:
        a sealed request ignores it
      schema: { type: string }
    filter:
      name: filter
      in: query
      schema: { type: string, enum: [sealed, singles] }
    report:
      name: report
      in: path
      required: true
      description: A newspaper report key, as reports.json lists them
      schema: { type: string, enum: [combined_spike_score, spike_score, greatest_increase_listings, greatest_decrease_listings, greatest_increase_buylist, greatest_decrease_buylist] }
    newsSort:
      name: sort
      in: query
      description: >-
        A sortable column's field from reports.json, or one of ranking,
        name, set, number, finish. Numbers sort as numbers, the rest as
        text, ties in ranking order
      schema: { type: string, default: ranking }
    newsDir:
      name: dir
      in: query
      description: asc by default for ranking, desc for any other sort
      schema: { type: string, enum: [asc, desc] }
    newsPage:
      name: page
      in: query
      description: >-
        The page of the filtered, sorted rows, 1,000 rows a page; past
        meta.pages, below 1 or not an integer is a 400
      schema: { type: integer, minimum: 1, default: 1 }
    newsSet:
      name: set
      in: query
      description: An edition name from the report's sets in reports.json, matched exactly
      schema: { type: string }
    newsRarity:
      name: rarity
      in: query
      description: The first letter of the card's rarity, or either of a pair
      schema: { type: string, enum: [M, R, U, C, S, M/R, U/C] }
    newsFinish:
      name: finish
      in: query
      description: A finish from the report's finishes in reports.json, matched exactly
      schema: { type: string }
    newsBucket:
      name: bucket
      in: query
      description: A price bucket, on reports that list bucket under filters
      schema: { type: string, enum: [$2+, $5+, $10+, $20+, $35+, $50+, $75+] }
    minPrice:
      name: min_price
      in: query
      description: Inclusive lower bound on the report's price column, on reports that list min_price; a row with no price fails it
      schema: { type: number }
    maxPrice:
      name: max_price
      in: query
      description: Inclusive upper bound on the report's price column, on reports that list max_price; a row with no price fails it
      schema: { type: number }
    minChange:
      name: min_change
      in: query
      description: >-
        Inclusive lower bound on the report's weekly change, in percent as
        the percent column is served (20 means 20%), on reports that list
        min_change; a row with no change fails it
      schema: { type: number }
      example: 20
    maxChange:
      name: max_change
      in: query
      description: >-
        Inclusive upper bound on the report's weekly change, in percent as
        the percent column is served (-10 means -10%), on reports that list
        max_change; a row with no change fails it
      schema: { type: number }
      example: -10
    idsOrSet:
      name: idsOrSet
      in: path
      required: true
      description: A set code, one card id, or a comma-separated list of card ids
      schema: { type: string }
    set:
      name: set
      in: path
      required: true
      schema: { type: string }
    range:
      name: range
      in: query
      description: >-
        The last N calendar days, today included, on the host's clock, up
        to the plan's lookback, which is the default. A request may cover
        120 card-months, a card being one printing in one finish: the
        range in 30-day months, rounded, times the cards it names, each
        finish an id resolves to counted. One id is always served whole,
        every finish and finish twin of its printing, whatever that
        costs.
      schema: { type: integer, minimum: 1 }
    page:
      name: page
      in: query
      description: >-
        1-based page of a set, each holding as many cards as the budget
        allows for the range; meta.pages says how many there are. The set
        form only: a card id or a batch of them ignores it
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    Prices:
      description: Price snapshot
      headers:
        RateLimit-Limit: { schema: { type: integer } }
        X-MTGBAN-Game: { schema: { type: string } }
        X-MTGBAN-Account: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PriceResponse" }
    Error:
      description: >-
        400 a bad option or report, or a bad parameter on the history
        endpoints (id, range, page) or too many ids, 401 bad key, 403 plan
        lacks the game or mode, 404 unknown path, card, set, or page past
        the end, 405 not GET, 429 rate limited (Retry-After),
        502/503/504 upstream or database trouble, 503 with Retry-After also
        for a newspaper report whose query has never succeeded, and on the
        history endpoints when every read slot stays busy, the archive
        read fails, or the host is still loading its card ids after a start
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NewspaperReports:
      description: The reports this game serves
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { $ref: "#/components/headers/NewspaperCacheControl" }
        Last-Modified: { schema: { type: string }, description: When the site last refreshed the newspaper }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NewspaperReports" }
    NewspaperReport:
      description: One page of a report's rows, in the order asked for
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { $ref: "#/components/headers/NewspaperCacheControl" }
        Last-Modified: { schema: { type: string }, description: When the site last refreshed the newspaper }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/NewspaperReport" }
    NewspaperCSV:
      description: >-
        One page of the rows as a table, header
        ranking,id,name,set,number,finish,rarity then the report's column
        fields, in the order asked for. meta travels in headers; a value
        that is absent or not a finite number is an empty cell.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { $ref: "#/components/headers/NewspaperCacheControl" }
        Last-Modified: { schema: { type: string }, description: When the site last refreshed the newspaper }
        X-MTGBAN-Date: { schema: { type: string, format: date }, description: The report's date; absent for a report with no rows }
        X-MTGBAN-Refreshed: { schema: { type: string, format: date-time }, description: When the site last refreshed the newspaper; absent before its first refresh }
        X-MTGBAN-Stale: { schema: { type: boolean }, description: True once that refresh is 12 hours old }
        X-MTGBAN-Rows: { schema: { type: integer }, description: Rows the filters matched, before paging }
        X-MTGBAN-Page: { schema: { type: integer }, description: This page }
        X-MTGBAN-Pages: { schema: { type: integer }, description: Pages of 1,000 rows the matched rows fill, at least 1 }
      content:
        text/csv:
          schema: { type: string }

    History:
      description: Daily prices, oldest first
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string }, description: "public, good until the next archive write; no-store while one is running" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HistoryResponse" }
    HistoryCSV:
      description: >-
        The JSON response's points as a flat table, header
        id,finish,store,section,date,price, section being retail or
        buylist; rows ordered by id, finish, store and date, retail before
        buylist for a store in both. meta travels in headers.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string }, description: "public, good until the next archive write; no-store while one is running" }
        X-MTGBAN-Latest: { schema: { type: string, format: date }, description: The newest day in the response, empty when there is none }
        X-MTGBAN-Range: { schema: { type: integer }, description: The days served }
        X-MTGBAN-Page: { schema: { type: integer }, description: Set requests only }
        X-MTGBAN-Pages: { schema: { type: integer }, description: Set requests only }
      content:
        text/csv:
          schema: { type: string }

  headers:
    NewspaperCacheControl:
      description: >-
        public, max-age to the next newspaper refresh (33 */3 * * * on the
        host's clock), at least 60 seconds; 60 while a due refresh has not
        landed, 300 once stale
      schema: { type: string }

  schemas:
    PriceResponse:
      type: object
      properties:
        error: { type: string }
        meta:
          type: object
          properties:
            date: { type: string, format: date-time }
            version: { type: string }
            base_url: { type: string, description: "Prefix for store redirects: base_url + tag + id" }
        retail: { $ref: "#/components/schemas/CardMap" }
        buylist: { $ref: "#/components/schemas/CardMap" }
    CardMap:
      type: object
      description: Card id, then finish, then store tag, then that store's conditions
      additionalProperties:
        type: object
        description: >-
          Finish: nonfoil, foil, etched, a game's own such as coldfoil,
          or sealed
        additionalProperties:
          type: object
          additionalProperties:
            type: array
            description: One entry per condition, best condition first
            items: { $ref: "#/components/schemas/Entry" }
    Entry:
      type: object
      required: [price]
      properties:
        condition:
          type: string
          enum: [NM, SP, MP, HP, PO]
          description: >-
            Near Mint, Slightly Played, Moderately Played, Heavily Played
            or Poor, best first; absent for an index price and for sealed
            products
        price:
          type: number
          format: float
          description: Best price in the condition, lowest retail or highest buylist, to the cent
        qty:
          type: integer
          description: >-
            Copies the store's own listings hold, or the copies a buylist
            buys; absent is unknown, or no limit on a buylist
        available:
          type: integer
          description: >-
            Every copy in the condition on sale at the store at any price,
            where it is counted; absent is unknown
    Stores:
      type: object
      properties:
        sellers: { type: array, items: { $ref: "#/components/schemas/Store" } }
        vendors: { type: array, items: { $ref: "#/components/schemas/Store" } }
    Store:
      type: object
      required: [shorthand, name]
      properties:
        shorthand: { type: string, description: The store's key in price lists }
        name: { type: string, description: The store's display name }
        country: { type: string }
        sealed: { type: boolean, description: The store prices sealed products }
        index: { type: boolean, description: The store's prices index a market and carry no condition }
        quantities: { type: boolean, description: The store's prices carry qty }
        credit_multiplier:
          type: number
          format: float
          description: A vendor's store credit against its cash price, 1.3 for 30% more
        updated: { type: string, format: date-time, description: When the store's prices were collected }
    Finish:
      type: object
      properties:
        value: { type: string, description: The finish key in price lists }
        label: { type: string }
        count: { type: integer, description: "Cards in the finish, or products for sealed" }
    Error:
      type: object
      properties:
        error: { type: string }
        game: { type: string }
    NewspaperMeta:
      type: object
      required: [latest, stale]
      properties:
        latest: { type: string, format: date, description: The newest report date }
        refreshed: { type: string, format: date-time, description: When the site last refreshed the newspaper; absent before its first refresh }
        stale: { type: boolean, description: True once that refresh is 12 hours old }
    NewspaperColumn:
      type: object
      required: [field, title, kind, sortable]
      properties:
        field: { type: string, description: The row key the column's values sit under }
        title: { type: string }
        kind:
          type: string
          enum: [dollar, percent, number, text]
          description: >-
            Numbers for dollar, percent and number, null where absent;
            strings for text. A percent is a percentage, the stored change
            times 100 to two decimals: 6.5 means 6.5%
        sortable: { type: boolean }
    NewspaperReportInfo:
      type: object
      required: [key, title, description, columns, filters, sets, finishes, rows]
      properties:
        key: { type: string }
        title: { type: string }
        description: { type: string }
        columns: { type: array, items: { $ref: "#/components/schemas/NewspaperColumn" } }
        filters:
          type: array
          items: { type: string, enum: [set, rarity, finish, bucket, min_price, max_price, min_change, max_change] }
        sets: { type: array, items: { type: string } }
        finishes: { type: array, items: { type: string } }
        buckets: { type: array, items: { type: string }, description: Reports that take bucket only }
        rows: { type: integer, description: "The latest edition's rows before filtering, 0 for a report not loaded yet or loaded empty" }
    NewspaperReports:
      type: object
      required: [meta, reports]
      properties:
        meta: { $ref: "#/components/schemas/NewspaperMeta" }
        reports: { type: array, items: { $ref: "#/components/schemas/NewspaperReportInfo" } }
    NewspaperReport:
      type: object
      required: [meta, rows]
      properties:
        meta:
          type: object
          required: [report, title, date, stale, rows, page, pages, columns]
          properties:
            report: { type: string }
            title: { type: string }
            date: { type: string, format: date, description: "The report's date, empty for a report with no rows" }
            refreshed: { type: string, format: date-time, description: When the site last refreshed the newspaper; absent before its first refresh }
            stale: { type: boolean }
            rows: { type: integer, description: Rows the filters matched, before paging }
            page: { type: integer, description: This page }
            pages: { type: integer, description: Pages of 1,000 rows the matched rows fill, at least 1 }
            columns: { type: array, items: { $ref: "#/components/schemas/NewspaperColumn" } }
        rows:
          type: array
          items: { $ref: "#/components/schemas/NewspaperRow" }
    NewspaperRow:
      type: object
      required: [ranking, id, name, set, number, finish, rarity]
      description: >-
        The card fields, then one key per column in meta.columns past
        ranking: a number for the dollar, percent and number kinds (null
        where the row has none or it is not finite; a percent in percent,
        6.5 for 6.5%) and a string for text
      properties:
        ranking: { type: integer }
        id: { type: string, description: "The card's MTGBAN id, as id=ban keys the price endpoints" }
        name: { type: string }
        set: { type: string }
        number: { type: string }
        finish: { type: string }
        rarity: { type: string }
      additionalProperties:
        oneOf:
          - { type: number, nullable: true }
          - { type: string }
    HistoryResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            date: { type: string, format: date-time }
            version: { type: string }
            base_url: { type: string }
            latest: { type: string, format: date, description: "The newest day in the response; usually yesterday, since the snapshot runs twice a day" }
            range: { type: integer, description: The days served }
            page: { type: integer, description: Set requests only }
            pages: { type: integer, description: Set requests only }
        retail: { $ref: "#/components/schemas/HistoryMap" }
        buylist: { $ref: "#/components/schemas/HistoryMap" }
    HistoryMap:
      type: object
      description: >-
        Card id, then finish, then store key (the price endpoints' tag for
        the source, or the archive's own shorthand for a TCGplayer series no
        store carries), then the series. A day a source has no price is left
        out. Prices are USD with no condition: lower grades were scaled to
        Near Mint before storage. A sealed product's series sit under the
        source's single-card tag (CK), not the sealed tag (CKSealed) the
        price endpoints use.
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Series" }
    Series:
      type: object
      required: [dates, prices]
      properties:
        dates: { type: array, items: { type: string, format: date }, description: Ascending }
        prices: { type: array, items: { type: number, format: float }, description: One per date }
