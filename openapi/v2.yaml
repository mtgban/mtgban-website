openapi: 3.0.0
info:
  title: BAN Price API
  version: 2.0.0
  description: >-
    Retail and buylist prices for singles and sealed products across many
    stores, by finish and by condition.

servers:
  - url: https://api.mtgban.com/v2/{game}
    variables:
      game:
        default: magic
        description: A game on your plan, as listed by https://api.mtgban.com/v2/games.json

security:
  - bearer: []
  - keyQuery: []

paths:
  /sets.json:
    get:
      summary: Set codes with data
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Array of set codes
          content:
            application/json:
              schema: { type: array, items: { type: string } }
        default: { $ref: "#/components/responses/Error" }

  /stores.json:
    get:
      summary: The stores the key can read, and what each one is
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Sellers and vendors, each sorted by shorthand
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Stores" }
        default: { $ref: "#/components/responses/Error" }

  /finishes.json:
    get:
      summary: The finishes prices are keyed by, commonest first
      parameters:
        - $ref: "#/components/parameters/filter"
      responses:
        "200":
          description: Finish keys with a display name and a count
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Finish" } }
        default: { $ref: "#/components/responses/Error" }

  /{mode}/{setOrId}.json:
    get:
      summary: Prices for one edition or one card
      description: >-
        setOrId is a set code for an edition snapshot, or a card id
        (MTGBAN, MTGJSON, Scryfall, or TCGplayer) for a single card.
        Replace .json with .csv for the version 1 CSV.
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist, all, sealed] }
        - name: setOrId
          in: path
          required: true
          schema: { type: string }
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/vendor"
        - $ref: "#/components/parameters/finish"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /search/{mode}/{query}.json:
    get:
      summary: Prices for every card matching a search
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist] }
        - name: query
          in: path
          required: true
          description: Search text in the site syntax
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /search/{mode}/sealed/{query}.json:
    get:
      summary: Prices for every sealed product matching a search
      parameters:
        - name: mode
          in: path
          required: true
          schema: { type: string, enum: [retail, buylist] }
        - name: query
          in: path
          required: true
          description: Search text in the site syntax
          schema: { type: string }
        - name: scope
          in: query
          schema: { type: string }
        - $ref: "#/components/parameters/id"
      responses:
        "200": { $ref: "#/components/responses/Prices" }
        default: { $ref: "#/components/responses/Error" }

  /history/{idsOrSet}.json:
    get:
      summary: Daily price history for cards or a page of a set
      description: >-
        idsOrSet is a set code for the set's singles, served in pages; a
        card id (MTGBAN, MTGJSON, Scryfall, or TCGplayer) for one printing
        in every finish; or a comma-separated list of card ids, with no
        spaces, for a batch. A single segment is tried as a set code
        first; a list with a comma is always a batch. Each id resolves to
        its printing's finishes and finish twins, and the distinct cards a
        batch covers, a card being one printing in one finish, count
        against the budget for the range. One id is always served. A
        printing has usually one to three finishes, so more than three ids
        per card allowed is a 400 before any resolves. Unknown ids are
        skipped; a batch of nothing but unknown ids is a 404. Needs
        the history mode. Replace .json with .csv for the same points as a
        flat table. Errors carry their HTTP status, unlike the price
        endpoints' 200 with an error body.
      parameters:
        - $ref: "#/components/parameters/idsOrSet"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Error" }

  /history/{idsOrSet}.csv:
    get:
      summary: Daily price history for cards or a page of a set, as CSV
      description: >-
        The forms and limits of /history/{idsOrSet}.json, one row per
        point. Errors stay JSON.
      parameters:
        - $ref: "#/components/parameters/idsOrSet"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/HistoryCSV" }
        default: { $ref: "#/components/responses/Error" }

  /history/sealed/{set}.json:
    get:
      summary: Daily price history for a set's sealed products, in pages
      parameters:
        - $ref: "#/components/parameters/set"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/History" }
        default: { $ref: "#/components/responses/Error" }

  /history/sealed/{set}.csv:
    get:
      summary: Daily price history for a set's sealed products, in pages, as CSV
      parameters:
        - $ref: "#/components/parameters/set"
        - $ref: "#/components/parameters/id"
        - $ref: "#/components/parameters/range"
        - $ref: "#/components/parameters/page"
      responses:
        "200": { $ref: "#/components/responses/HistoryCSV" }
        default: { $ref: "#/components/responses/Error" }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: Authorization Bearer ban_live_... or ban_demo_...
    keyQuery:
      type: apiKey
      in: query
      name: key
      description: For tools that cannot set headers; the key lands in logs

  parameters:
    id:
      name: id
      in: query
      description: Id system for card keys
      schema: { type: string, enum: [ban, tcg, scryfall, mtgjson, mkm, ck, name] }
    vendor:
      name: vendor
      in: query
      description: Comma-separated store tags
      schema: { type: string }
    finish:
      name: finish
      in: query
      description: >-
        Comma-separated finishes, spelled as the finish keys. Singles only:
        a sealed request ignores it
      schema: { type: string }
    filter:
      name: filter
      in: query
      schema: { type: string, enum: [sealed, singles] }
    idsOrSet:
      name: idsOrSet
      in: path
      required: true
      description: A set code, one card id, or a comma-separated list of card ids
      schema: { type: string }
    set:
      name: set
      in: path
      required: true
      schema: { type: string }
    range:
      name: range
      in: query
      description: >-
        The last N calendar days, today included, on the host's clock, up
        to the plan's lookback, which is the default. A request may cover
        120 card-months, a card being one printing in one finish: the
        range in 30-day months, rounded, times the cards it names, each
        finish an id resolves to counted. One id is always served whole,
        every finish and finish twin of its printing, whatever that
        costs.
      schema: { type: integer, minimum: 1 }
    page:
      name: page
      in: query
      description: >-
        1-based page of a set, each holding as many cards as the budget
        allows for the range; meta.pages says how many there are
      schema: { type: integer, minimum: 1, default: 1 }

  responses:
    Prices:
      description: Price snapshot
      headers:
        RateLimit-Limit: { schema: { type: integer } }
        X-MTGBAN-Game: { schema: { type: string } }
        X-MTGBAN-Account: { schema: { type: string } }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/PriceResponse" }
    Error:
      description: >-
        400 bad parameter on the history endpoints (id, range, page) or
        too many ids, 401 bad key, 403 plan lacks the game or mode, 404
        unknown path, card, set, or page past the end, 405 not GET, 429
        rate limited (Retry-After), 502/503/504 upstream or database
        trouble, 503 with Retry-After on the history endpoints when every
        read slot stays busy or the archive read fails
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    History:
      description: Daily prices, oldest first
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string }, description: "public, good until the next archive write; no-store while one is running" }
      content:
        application/json:
          schema: { $ref: "#/components/schemas/HistoryResponse" }
    HistoryCSV:
      description: >-
        The JSON response's points as a flat table, header
        id,finish,store,section,date,price, section being retail or
        buylist; rows ordered by id, finish, store and date, retail before
        buylist for a store in both. meta travels in headers.
      headers:
        ETag: { schema: { type: string } }
        Cache-Control: { schema: { type: string }, description: "public, good until the next archive write; no-store while one is running" }
        X-MTGBAN-Latest: { schema: { type: string, format: date }, description: The newest day in the response, empty when there is none }
        X-MTGBAN-Range: { schema: { type: integer }, description: The days served }
        X-MTGBAN-Page: { schema: { type: integer }, description: Set requests only }
        X-MTGBAN-Pages: { schema: { type: integer }, description: Set requests only }
      content:
        text/csv:
          schema: { type: string }

  schemas:
    PriceResponse:
      type: object
      properties:
        error: { type: string }
        meta:
          type: object
          properties:
            date: { type: string, format: date-time }
            version: { type: string }
            base_url: { type: string, description: "Prefix for store redirects: base_url + tag + id" }
        retail: { $ref: "#/components/schemas/CardMap" }
        buylist: { $ref: "#/components/schemas/CardMap" }
    CardMap:
      type: object
      description: Card id, then finish, then store tag, then that store's conditions
      additionalProperties:
        type: object
        description: >-
          Finish: nonfoil, foil, etched, a game's own such as coldfoil,
          or sealed
        additionalProperties:
          type: object
          additionalProperties:
            type: array
            description: One entry per condition, best condition first
            items: { $ref: "#/components/schemas/Entry" }
    Entry:
      type: object
      required: [price]
      properties:
        condition:
          type: string
          enum: [NM, SP, MP, HP, PO]
          description: >-
            Near Mint, Slightly Played, Moderately Played, Heavily Played
            or Poor, best first; absent for an index price and for sealed
            products
        price:
          type: number
          format: float
          description: Best price in the condition, lowest retail or highest buylist, to the cent
        qty:
          type: integer
          description: >-
            Copies the store's own listings hold, or the copies a buylist
            buys; absent is unknown, or no limit on a buylist
        available:
          type: integer
          description: >-
            Every copy in the condition on sale at the store at any price,
            where it is counted; absent is unknown
    Stores:
      type: object
      properties:
        sellers: { type: array, items: { $ref: "#/components/schemas/Store" } }
        vendors: { type: array, items: { $ref: "#/components/schemas/Store" } }
    Store:
      type: object
      required: [shorthand, name]
      properties:
        shorthand: { type: string, description: The store's key in price lists }
        name: { type: string, description: The store's display name }
        country: { type: string }
        sealed: { type: boolean, description: The store prices sealed products }
        index: { type: boolean, description: The store's prices index a market and carry no condition }
        quantities: { type: boolean, description: The store's prices carry qty }
        credit_multiplier:
          type: number
          format: float
          description: A vendor's store credit against its cash price, 1.3 for 30% more
        updated: { type: string, format: date-time, description: When the store's prices were collected }
    Finish:
      type: object
      properties:
        value: { type: string, description: The finish key in price lists }
        label: { type: string }
        count: { type: integer, description: "Cards in the finish, or products for sealed" }
    Error:
      type: object
      properties:
        error: { type: string }
        game: { type: string }
    HistoryResponse:
      type: object
      properties:
        meta:
          type: object
          properties:
            date: { type: string, format: date-time }
            version: { type: string }
            base_url: { type: string }
            latest: { type: string, format: date, description: "The newest day in the response; usually yesterday, since the snapshot runs twice a day" }
            range: { type: integer, description: The days served }
            page: { type: integer, description: Set requests only }
            pages: { type: integer, description: Set requests only }
        retail: { $ref: "#/components/schemas/HistoryMap" }
        buylist: { $ref: "#/components/schemas/HistoryMap" }
    HistoryMap:
      type: object
      description: >-
        Card id, then finish, then store key (the price endpoints' tag for
        the source, or the archive's own shorthand for a TCGplayer series no
        store carries), then the series. A day a source has no price is left
        out. Prices are USD with no condition: lower grades were scaled to
        Near Mint before storage. A sealed product's series sit under the
        source's single-card tag (CK), not the sealed tag (CKSealed) the
        price endpoints use.
      additionalProperties:
        type: object
        additionalProperties:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Series" }
    Series:
      type: object
      required: [dates, prices]
      properties:
        dates: { type: array, items: { type: string, format: date }, description: Ascending }
        prices: { type: array, items: { type: number, format: float }, description: One per date }
