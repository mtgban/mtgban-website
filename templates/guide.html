{{define "extra-css"}}
    <link rel="stylesheet" type="text/css" href="/css/guide.css?hash={{.Hash}}">
{{end}}

{{define "extra-head"}}
    <script type="text/javascript" src="/js/guide-data.js?hash={{.Hash}}"></script>
    <script>window.__BAN_STORES = {{guide_stores}};</script>
{{end}}

{{define "content"}}
<div class="guide-container">
    <nav class="guide-sidebar" id="guide-sidebar">
        <div class="guide-sidebar-header">
            <input class="guide-filter-input" id="guide-filter" type="text"
                   placeholder="Filter sections..." autocomplete="off" />
        </div>
        <div class="guide-sidebar-nav" id="guide-sidebar-nav">
            <!-- Built by JS -->
        </div>
    </nav>

    <main class="guide-main" id="guide-main">
        <div class="guide-hero">
            <h1>MTG<span class="ban">BAN</span> Guide</h1>
            <p class="guide-hero-sub">Search syntax, tools, and power user tips</p>
            <div class="guide-hero-shortcut">
                Press <kbd>Ctrl+K</kbd>/<kbd>Cmd+K</kbd> or <kbd>/</kbd> to open the command palette from any page
            </div>
        </div>
        <div class="guide-tabs" role="tablist">
            <button type="button" class="guide-tab" data-tab="overview" role="tab">Overview</button>
            <button type="button" class="guide-tab" data-tab="palette" role="tab">Command Palette</button>
            <button type="button" class="guide-tab" data-tab="syntax" role="tab">Syntax</button>
            <button type="button" class="guide-tab" data-tab="api" role="tab">API</button>
            <button type="button" class="guide-tab" data-tab="faq" role="tab">F.A.Q.</button>
        </div>
        <div id="guide-sections" data-tab-pane="structured">
            <!-- Built by JS -->
        </div>
        <div id="faq" data-tab="faq">
            {{template "guide-faq-content" .}}
        </div>
    </main>
</div>

<script type="text/javascript" src="/js/guide.js?hash={{.Hash}}"></script>
{{end}}
