{{/* The offline page's sort buttons, desktop and phone alike, with their
     icons inline: nothing may be there to paint them. Called with dict
     "Class" the stem of the buttons' classes. */}}
{{define "offline-sort-pills"}}
<button class="{{.Class}}-pill" data-sort="chrono" title="Chronological" aria-label="Sort chronological" type="button" data-track="ui.offline.page" data-track-value="sort"><svg class="lucide lucide-clock" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>{{template "offline-sort-dir" .}}</button>
<button class="{{.Class}}-pill" data-sort="alpha" title="Alphabetical" aria-label="Sort alphabetical" type="button" data-track="ui.offline.page" data-track-value="sort"><svg class="lucide lucide-a-large-small" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14h-5"/><path d="M16 16v-3.5a2.5 2.5 0 0 1 5 0V16"/><path d="M4.5 13h6"/><path d="m3 16 4.5-9 4.5 9"/></svg>{{template "offline-sort-dir" .}}</button>
<button class="{{.Class}}-pill" data-sort="number" title="Collector Number" aria-label="Sort by collector number" type="button" data-track="ui.offline.page" data-track-value="sort"><svg class="lucide lucide-hash" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="9" y2="9"/><line x1="4" x2="20" y1="15" y2="15"/><line x1="10" x2="8" y1="3" y2="21"/><line x1="16" x2="14" y1="3" y2="21"/></svg>{{template "offline-sort-dir" .}}</button>
<button class="{{.Class}}-pill" data-sort="retail" title="Retail Price" aria-label="Sort by retail price" type="button" data-track="ui.offline.page" data-track-value="sort"><svg class="lucide lucide-tag" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>{{template "offline-sort-dir" .}}</button>
<button class="{{.Class}}-pill" data-sort="buylist" title="Buylist Price" aria-label="Sort by buylist price" type="button" data-track="ui.offline.page" data-track-value="sort"><svg class="lucide lucide-shopping-cart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>{{template "offline-sort-dir" .}}</button>
{{end}}

{{define "offline-sort-dir"}}<span class="{{.Class}}-dir"><svg class="lucide lucide-arrow-up" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg></span>{{end}}
