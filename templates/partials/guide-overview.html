<template data-section="welcome">
<p>MTG<span class="ban">BAN</span> aggregates retail and buylist prices for Magic: The Gathering singles and sealed products across dozens of vendors. Everything on the site is built around two things: a flexible search syntax, and a keyboard-driven command palette that composes that syntax for you.</p>
<p>The three things you can reach from anywhere:</p>
<ul>
    <li><strong>Search</strong> - find prices for a card or sealed product, filter by set, rarity, finish, condition, store, region, or price thresholds. Results split into retail and buylist, with condition breakdowns and index references from aggregators like TCGplayer.</li>
    <li><strong>The Command Palette</strong> - <kbd>Ctrl+K</kbd> / <kbd>Cmd+K</kbd> from any page (or <kbd>/</kbd> when no input is focused) opens a single surface for searching cards, composing filter queries with guided chips, jumping to pages, recalling saved commands, browsing sealed products, and uploading collections.</li>
    <li><strong>Tools</strong> - Newspaper for daily market movement, Sleepers for undervalued cards, Arbitrage for retail/buylist gaps, and Upload &amp; Optimize for splitting a collection across buylists.</li>
</ul>
<p>The rest of this guide is organized by tab:</p>
<ul>
    <li><strong>Overview</strong> (you are here) - the palette at a glance, then a tour of the tools available on your account, then power-user tips.</li>
    <li><strong>Command Palette</strong> - chips, modes, multi-stage navigation, saved commands, walkthroughs, and the full keyboard cheatsheet.</li>
    <li><strong>Syntax</strong> - reference for every search prefix.</li>
    <li><strong>API</strong> - keys, endpoints, query options, and the response format of the price data API.</li>
    <li><strong>F.A.Q.</strong> - common questions.</li>
</ul>
</template>

<template data-section="palette-modes">
<p>Press <kbd>Ctrl+K</kbd> / <kbd>Cmd+K</kbd> from any page (or <kbd>/</kbd> when no input is focused) to open the palette. The default view shows six shortcut tiles, each backed by a single-character prefix you can type directly into the input. Type a card name with no prefix to search; everything else is one keystroke away.</p>
<p>The palette also supports guided filter chips - type a prefix like <code>s:</code> or <code>r:</code> and the dropdown shows matching options. <kbd>Tab</kbd> locks the highlighted option as a chip; chain chips to compose complex queries. When a card chip is locked first, subsequent filter dropdowns narrow to what exists for that card. For the full reference, see the <strong>Command Palette</strong> tab.</p>
</template>

<template data-section="feature-search">
<p>The main search page is the entry point for finding prices across every tracked store and vendor. It handles both single cards and sealed products, and accepts the full filter syntax documented in the Syntax tab.</p>
<p><strong>Results layout:</strong> retail prices and buylist offers are split into separate tables. Each card has condition breakdowns (NM/SP/MP/HP/PO), and index prices from aggregators like TCGplayer Market, TCG Low, and Card Kingdom appear alongside individual vendor prices for reference.</p>
<p><strong>Per-card actions:</strong></p>
<ul>
    <li><strong>📊 chart icon</strong> - opens historical price data from major vendors</li>
    <li><strong>📖 book icon</strong> - opens the reprint finder, listing every product containing any reprint of that card</li>
    <li><strong>Buy links</strong> - vendor affiliate links that support BAN at no extra cost</li>
</ul>
<p>The command palette's default behavior (type a card name, press Enter) lands you here.</p>
</template>

<template data-section="feature-sealed">
<p>The Sealed page is a structured directory of every sealed product BAN tracks. The left sidebar groups products by category; the main area shows the selected category as a clickable grid with set symbols for orientation.</p>
<p>Three ways to find a product:</p>
<ul>
    <li><strong>Browse by category</strong> - pick a category in the sidebar (Commander Decks, Expansions, Boxed Sets, etc.)</li>
    <li><strong>Search</strong> - type into the product search input to filter by name across all categories</li>
    <li><strong>Surprise Me</strong> - opens a random product</li>
</ul>
<p>Clicking a product takes you to its price grid (every vendor selling it, plus index references). From the command palette, <code>$&lt;product name&gt;</code> reaches the same destination and adds two shortcuts the page itself doesn't expose: <kbd>Shift+Enter</kbd> for the product's contents, <kbd>Ctrl+Enter</kbd> for a pack-pull simulation.</p>
</template>

<template data-section="feature-newspaper">
<p>The Newspaper is BAN's daily snapshot of meaningful market movement. Each issue is an "edition" - the Early Edition is the in-progress view of the current day, with the previous full day available on a delay.</p>
<p><strong>Six metric cards make up an issue:</strong></p>
<p><strong>Spike scores</strong> - cards whose prices have jumped recently:</p>
<ul>
    <li><em>Top Singles by Combined Spike Score</em> - blends TCGplayer sales velocity with Card Kingdom buylist movement. The strongest signal of "something is happening" because two independent data sources agree.</li>
    <li><em>Top Singles by Spike Score</em> - TCGplayer-only sales-velocity spikes. Useful for catching moves before they propagate.</li>
</ul>
<p><strong>Vendor listings (supply signals)</strong> - tracks how many sellers have a card in stock:</p>
<ul>
    <li><em>Greatest Increase</em> - stock is piling up faster than it sells. <strong>Avoid these</strong> as buys.</li>
    <li><em>Greatest Decrease</em> - stock is drying up. <strong>Seek these out</strong> as buys.</li>
</ul>
<p><strong>Buylist offers (demand signals)</strong> - tracks what vendors are willing to pay:</p>
<ul>
    <li><em>Greatest Increase</em> - higher offers indicate higher sales rates for the vendor. Can be fleeting; not a sole-source signal unless you're dropshipping.</li>
    <li><em>Greatest Decrease</em> - declining offers indicate the vendor is moving fewer copies. Same caveat applies.</li>
</ul>
<p>The <strong>Archive</strong> view (palette: <code>&gt;newspaper + Tab + Archive</code>) browses historical issues by date.</p>
</template>

<template data-section="feature-screener">
<p>The Screener finds cards whose price has moved by a threshold you choose. Where the Newspaper is a fixed daily snapshot, every filter here is editable - so you can ask arbitrary questions like "TCGplayer Low $50 or more, up 20% or more over the last 30 days."</p>
<p><strong>How it works:</strong> pick a price <strong>metric</strong> and a <strong>window</strong>, choose whether you want cards moving <strong>up</strong>, <strong>down</strong>, or <strong>either</strong>, then set your floors and percent threshold. Results are every card matching all of it, sortable by current price, prior price, percent change, or dollar change.</p>
<p><strong>Two price floors:</strong> <em>Now $</em> filters on the current price; <em>Was $</em> filters on the price at the start of the window. They combine, so you can screen for cards that <em>were</em> $100+ and have since moved, regardless of where they sit now.</p>
<p>The <strong>Type</strong> toggle switches between singles, sealed products, or both. The <strong>Editions</strong> dropdown narrows to specific sets (checkboxes populated from the current results). Set <strong>Per page</strong> and press <strong>Apply</strong>; <strong>Reset</strong> returns everything to defaults.</p>
</template>

<template data-section="feature-sleepers">
<p>Sleepers surfaces cards where market pricing hasn't kept pace with demand, scarcity, or cross-market differences. Every result is tiered <strong>S through F</strong> - higher tiers mean stronger signals.</p>
<p><strong>Four analysis modes</strong> (each is its own page; palette: <code>&gt;sleepers + Tab + &lt;mode&gt;</code>):</p>
<ul>
    <li><strong>Bulk Me Up</strong> - cards deviating from their set's average over the last 5 years; unexpected gems hiding in bulk</li>
    <li><strong>Long Time No Reprint</strong> - no reprint in 2+ years; excludes bulk, Reserved List, and non-tournament cards</li>
    <li><strong>Market Mismatch</strong> - buylist exceeds market price, or card is priced below TCG Low; direct arbitrage signal</li>
    <li><strong>Hotlist</strong> - most buylist growth over the past 3 months; emerging trends before they fully break</li>
</ul>
<p><strong>Ocean Gap</strong> (BETA) is a fifth, distinct tool on the same page: it compares two sellers head-to-head and surfaces cards where one is cheaper than the other. Preset pairings between common reference indexes are one click each; custom pairings (pick any reference, any target) require a higher tier.</p>
</template>

<template data-section="feature-upload">
<p>Upload &amp; Compare matches your collection against every active vendor and reports prices side-by-side. The page is a three-step flow.</p>
<p><strong>Step 1 - Mode &amp; Stores.</strong> Toggle between <strong>Retail</strong> (cheapest places to buy) and <strong>Buylist</strong> (best places to sell), then pick which vendors to include - Card Kingdom, Star City Games, Strike Zone, TCG Direct (net), TCGplayer SYP, and others depending on your tier. Your selection persists as a cookie, so the palette's upload mode (<code>+</code>) uses the same set.</p>
<p><strong>Step 2 - Load data.</strong> Three input paths:</p>
<ul>
    <li><strong>Local CSV/XLS</strong> - drop or browse for a file (max 5MB)</li>
    <li><strong>Remote URL</strong> - Google Sheets (must be publicly accessible), or collection and deck tracker URLs</li>
    <li><strong>Paste Text</strong> - any tab/comma-separated text, or a plain card-name decklist</li>
</ul>
<p><strong>Step 3 - Process.</strong> <em>Upload</em> runs the match and produces an in-browser results page. From there, <em>Get CSV</em> downloads the full results, and three export buttons format the data for specific destinations: <em>CardConduit</em> (estimate), <em>Deckbox CSV</em>, and <em>TCGplayer CSV</em>.</p>
<p><strong>Format detection.</strong> Exports from TCGplayer, Deckbox, BinderPOS, and Cardsphere are auto-detected. Plain card-name lists also work - the most recent printing is used for ambiguous names. To pin a specific printing of a multi-printing card, include the collector number or variant.</p>
<p><strong>Sheet quirks:</strong> Excel sheets must contain <code>mtgban</code> somewhere in the sheet name (BAN uses this to find the right tab in multi-sheet workbooks). A Google Sheets URL is remembered as a preference and reused on the next visit.</p>
<p><strong>Limits:</strong> 350 entries per upload (1000 with Optimizer tier). Rows with quantity 0 are skipped; identical entries with matching condition are merged.</p>
</template>

<template data-section="feature-global">
<p>Global is a cross-store arbitrage tool that picks one store as a reference (the <em>index</em>) and surfaces cards where other markets are charging more. Unlike per-card Search, Global operates at the index level: every result is a comparison between the chosen index and one or more target stores.</p>
<p><strong>Pick an index:</strong></p>
<ul>
    <li><strong>Singles</strong> - Card Kingdom, Star City Games, TCG Market</li>
    <li><strong>Sealed</strong> - CT Zero EV Sealed, TCG Direct (net) EV Sealed, TCG Low EV Sealed (EV = expected value of pack contents)</li>
</ul>
<p>The results page shows each card with the index price, the target store's price, the dollar profit, the dollar difference, and a spread percentage. Direct Buy links go to both the source (the cheap index) and the target.</p>
<p><strong>Filters</strong> - the <strong>Filters</strong> button above the results opens the bar that sets them: untick conditions, finishes or rarities to hide them, type limits for either price, the spread, the difference and the profit, and turn on the options in its last row. Each is listed here:</p>
</template>

<template data-section="feature-arbitrage">
<p>Arbitrage identifies cards where a meaningful gap exists between a vendor's retail price and another vendor's buylist offer - i.e. potential flip opportunities. The same filter bar as Global narrows the results, and the <code>&gt;arbit + Tab</code> palette menu opens the page in any sort order.</p>
<p>See also the <strong>Reverse</strong> page (buylists paying more than retail) and the <strong>Global</strong> page (cross-store comparison at the index level), which are part of the same toolkit.</p>
</template>

<template data-section="feature-reverse">
<p>Reverse is the inverted complement to <strong>Arbitrage</strong>: it surfaces cards where a buylist is paying <em>more</em> than another vendor is selling for retail. These are the most direct flip signals on the site - if a buylist is over retail elsewhere and the source has stock, the gap is real.</p>
<p>The same filter bar applies, and the palette's <code>&gt;reverse + Tab</code> menu opens the page in any sort order.</p>
</template>

<template data-section="tips-reading-prices">
<p>A few things to know when looking at price data:</p>
<p><strong>Price refresh:</strong> Data is updated periodically throughout the day. The exact delay is randomized to prevent sniping.</p>
<p><strong>Conditions:</strong> Inventory prices reflect stated conditions (accuracy depends on the provider). Buylist prices are always NM. Sealed products are always in sealed/unopened condition. The Index condition is for trend data only - no quantities are tracked.</p>
<p><strong>Buylist ratios:</strong> The percentage shown on buylist results reflects vendor desirability - higher means they want it more. Only shown when the vendor also has retail stock at matching conditions.</p>
<p><strong>Trade credit:</strong> Hover over a buylist price to see the corresponding trade credit value, if available.</p>
</template>

<template data-section="tips-ck-signals">
<p>Card Kingdom pays one of a short list of prices for each retail price, and moves up and down that list with how many copies it needs; its retail price carries the moves that last. BAN reads CK's list every day and marks CK's offer:</p>
<ul>
    <li><strong>Green</strong> - sell now. CK is more likely to cut its offer than raise it: the card's set came out about a month ago, the card was just reprinted in a Modern Horizons, Commander or Masters set, or CK sells it well above TCG Market.</li>
    <li><strong>Amber ↑</strong> - wait. CK is more likely to raise its offer: CK's stock halved since yesterday, CK just sold out, or TCG Market jumped this week. A wait wins over a sell now.</li>
    <li><strong>No color</strong> - none of these.</li>
    <li><strong>Paused</strong> - CK isn't buying the card. Its last known offer says for how long (<em>Paused 11d</em>); hover it for the chances CK buys it again within a month. An amber ↑ there means CK is more likely than not to come back within a month paying more than the best other cash offer.</li>
</ul>
<p>Hover CK's price (on mobile, open the offer) for why it is colored, CK's stock and TCG Market's week, and the chances CK pays more, or less or nothing, a week and a month later, next to the chances on any card. They are measured every day, on cards of the same finish and price range. The <em>90d high</em> pill marks CK paying its highest price of the last 90 days; <em>New high</em> marks a price above all of them. The colors and pills apply when CK pays $3 or more; other stores' offers only show whether they reach CK's usual high (<em>Good</em>). A color whose chances were not measured is left off.</p>
</template>

<template data-section="tips-power-features">
<p>A handful of features that are easy to miss:</p>
<p><strong>Historical data:</strong> Click the 📊 chart icon on any card to view price history from major vendors.</p>
<p><strong>Reprint finder:</strong> Click 📖 on a card to see every product containing any reprint of that card. Source products are also accessible via "Found in * products" links.</p>
<p><strong>Flavor names:</strong> Searching a flavor name returns only those specific art versions (unless disabled in preferences). This does not work for complex multi-filter queries.</p>
<p><strong>Feedback:</strong> Report issues in the #feedback channel on the BAN Discord with a URL or screenshot. Some errors originate from upstream providers.</p>
</template>
