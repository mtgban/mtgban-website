{{/* The Arbitrage, Global and Reverse tabs: one vendor grid each, on the
     cookie its page reads. */}}
{{define "settings-tab-vendors"}}
<section class="settings-section expanded">
    <div class="settings-section-header" data-role="section-toggle">
        <h3>Vendors</h3>
        <i class="settings-section-chevron" data-lucide="chevron-right"></i>
    </div>
    <div class="settings-section-body">
        <p class="section-desc">Checked vendors will be <strong>hidden</strong> from results.</p>
        {{template "settings-stores-grouped" .}}
    </div>
</section>
{{end}}
