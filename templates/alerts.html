{{define "title"}}Price Alerts{{end}}

{{define "extra-css"}}
    <link rel="stylesheet" type="text/css" href="/css/settings-modal.css?hash={{.Hash}}">
    <link rel="stylesheet" type="text/css" href="/css/alerts.css?hash={{.Hash}}">
{{end}}

{{define "content"}}
{{template "alert-modal" .}}
<div class="alerts-page">
    <div id="hoverWrap" class="foil-wrap hoverWrap">
        <img id="hoverImage" class="hoverImage" src="{{card_art_placeholder}}"/>
    </div>
    {{template "alerts-body" .}}
</div>
{{end}}

{{define "extra-scripts"}}
<script type="text/javascript" src="/js/confirm-dialog.js?hash={{.Hash}}" defer></script>
<script type="text/javascript" src="/js/alerts.js?hash={{.Hash}}" defer></script>
<script type="text/javascript" src="/js/followmouse.js?hash={{.Hash}}" defer></script>
{{end}}
