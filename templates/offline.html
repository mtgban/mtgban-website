{{define "extra-css"}}
    <link rel="stylesheet" type="text/css" href="/css/search.css?hash={{.Hash}}">
    <link rel="stylesheet" type="text/css" href="/css/offline.css?hash={{.Hash}}">
{{end}}

{{define "title"}}Offline Search{{end}}

{{define "extra-head"}}
    <script type="text/javascript" src="/js/cookies.js?hash={{.Hash}}"></script>
    <script type="text/javascript" src="/js/offline/offline-format.js?hash={{.Hash}}"></script>
    <script type="text/javascript" src="/js/offline/offline-util.js?hash={{.Hash}}"></script>
    <script type="text/javascript" src="/js/offline/offline-query.js?hash={{.Hash}}"></script>
    <script type="text/javascript" src="/js/offline/offline-render.js?hash={{.Hash}}"></script>
{{end}}

{{define "content"}}
<div class="offline-shell">
    <div id="offline-banner" class="offline-banner" hidden></div>
    <div class="search-layout">
        <div class="search-sidebar">
            <div class="sidebar-search">
                <div class="offline-searchbar">
                    <input id="offline-searchbox" type="text" list="offline-card-names"
                           placeholder="Search offline prices..." maxlength="1000"
                           autocapitalize="none" autocomplete="off" spellcheck="false" autofocus>
                    <datalist id="offline-card-names"></datalist>
                </div>
                <div class="search-sort-row">
                    <span class="search-sort-label">Sort</span>
                    <button class="search-sort-pill" data-sort="chrono" title="Chronological" type="button">Time</button>
                    <button class="search-sort-pill" data-sort="alpha" title="Alphabetical" type="button">A-Z</button>
                    <button class="search-sort-pill" data-sort="number" title="Collector Number" type="button">#</button>
                    <button class="search-sort-pill" data-sort="retail" title="Retail Price" type="button">$</button>
                    <button class="search-sort-pill" data-sort="buylist" title="Buylist Price" type="button">BL</button>
                </div>
                <div class="search-result-divider">
                    <span class="search-result-count" id="offline-count"></span>
                </div>
            </div>
            <div class="sidebar-body">
                <div class="sidebar-img-wrap foil-wrap" id="cardImageWrapper">
                    <img class="sidebar-card-img" id="cardImage" src="" alt="">
                </div>
            </div>
            <div class="sidebar-footer">
                <a class="sidebar-action default" href="/search?settings=1">Offline sync settings</a>
            </div>
        </div>
        <div class="search-results" id="offline-results"></div>
    </div>
</div>
{{end}}

{{define "extra-scripts"}}
<script type="text/javascript">
(function () {
    'use strict';

    var PLACEHOLDER = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
    // Mirrors MaxSearchResults (search.go:29); no pagination in v1.
    var PAGE_SIZE = 100;

    var dicts = null;
    var env = null;
    var exec = null;
    var ctx = null;
    var sortMode = getCookie('SearchDefaultSort') || 'chrono';
    var reverse = false;
    if (sortMode === 'hybrid') sortMode = 'alpha';
    var namesP = null;
    var nameReq = 0;

    function hiddenList(name) {
        return (getCookie(name) || '').split(',').filter(Boolean);
    }

    async function setup() {
        // Warm the shared connection and fail fast if the DB is absent.
        await OfflineDB.open();
        dicts = await OfflineUtil.loadCatalogDicts();
        env = {
            normName: OfflineUtil.normName,
            lookupName: OfflineDB.lookupName,
            allNames: OfflineDB.allNames,
            getCard: OfflineDB.getCard,
            hasSet: OfflineDB.hasSet,
            loadSetPayload: OfflineUtil.loadSetPayload
        };
        ctx = {
            sets: dicts.sets,
            stores: dicts.stores,
            hiddenSellers: hiddenList('SearchSellersList'),
            hiddenVendors: hiddenList('SearchVendorsList'),
            byStore: getCookie('SearchListingPriority') === 'stores'
        };
    }

    function paintCount() {
        var el = document.getElementById('offline-count');
        if (!exec) { el.textContent = ''; return; }
        var n = exec.results.length;
        var shown = Math.min(n, PAGE_SIZE);
        el.textContent = n ? n + ' result' + (n > 1 ? 's' : '') + ' found' + (n > shown ? ' (' + shown + ' shown)' : '') : '';
    }

    function paintPills() {
        document.querySelectorAll('.search-sort-pill').forEach(function (b) {
            b.classList.toggle('active', b.getAttribute('data-sort') === sortMode);
            b.classList.toggle('reversed', b.getAttribute('data-sort') === sortMode && reverse);
        });
    }

    function paint() {
        OfflineQuery.sortResults(exec.results, sortMode, reverse, ctx.sets);
        var page = Object.assign({}, exec, {results: exec.results.slice(0, PAGE_SIZE)});
        OfflineRender.render(document.getElementById('offline-results'), page, ctx);
        paintCount();
        paintPills();
        var first = document.querySelector('#offline-results .result-header');
        if (first) showImage(first.getAttribute('data-image-url'));
    }

    async function runQuery(q) {
        if (!q) {
            exec = null;
            document.getElementById('offline-results').innerHTML = '';
            paintCount();
            return;
        }
        exec = await OfflineQuery.execute(OfflineQuery.parse(q), env);
        paint();
    }

    function showImage(url) {
        var img = document.getElementById('cardImage');
        if (img && url) img.src = url;
    }

    function showErrorNotice(err) {
        document.getElementById('offline-results').innerHTML =
            '<div class="offline-notice offline-notice-warn">Offline data is not ready. Enable offline mode in Settings and let a sync finish.</div>';
        console.error('offline shell setup failed', err);
    }

    document.addEventListener('DOMContentLoaded', function () {
        // Sidebar image follows the hovered result, like search.html.
        document.getElementById('offline-results').addEventListener('mouseover', function (e) {
            var row = e.target.closest('[data-image-url]');
            if (row) showImage(row.getAttribute('data-image-url'));
        });

        // Failed offline images fall back to the neutral placeholder.
        document.getElementById('cardImage').addEventListener('error', function () {
            if (this.src !== PLACEHOLDER) this.src = PLACEHOLDER;
        });

        document.querySelectorAll('.search-sort-pill').forEach(function (b) {
            b.addEventListener('click', function () {
                var mode = b.getAttribute('data-sort');
                reverse = (mode === sortMode) ? !reverse : false;
                sortMode = mode;
                if (exec) paint();
            });
        });

        // Datalist suggestions from the in-memory name list, capped small.
        var box = document.getElementById('offline-searchbox');
        box.addEventListener('input', async function () {
            if (!env) return;
            var needle = OfflineUtil.normName(box.value);
            if (needle.length < 3) return;
            namesP = namesP || env.allNames();
            var t = ++nameReq;
            var list = await namesP;
            if (t !== nameReq) return;
            var opts = [];
            for (var i = 0; i < list.length && opts.length < 25; i++) {
                if (list[i].key.indexOf(needle) !== -1) opts.push(list[i].key);
            }
            document.getElementById('offline-card-names').innerHTML =
                opts.map(function (k) { return '<option value="' + k + '"></option>'; }).join('');
        });

        box.addEventListener('keydown', function (e) {
            if (!env) return;
            if (e.key !== 'Enter') return;
            e.preventDefault();
            var q = box.value.trim();
            history.pushState(null, '', q ? '?q=' + encodeURIComponent(q) : location.pathname);
            runQuery(q).catch(showErrorNotice);
        });

        window.addEventListener('popstate', function () {
            var q = new URLSearchParams(location.search).get('q') || '';
            box.value = q;
            runQuery(q).catch(showErrorNotice);
        });

        setup().then(function () {
            var q = new URLSearchParams(location.search).get('q') || '';
            box.value = q;
            return runQuery(q);
        }).catch(showErrorNotice);
    });
})();
</script>
{{end}}
