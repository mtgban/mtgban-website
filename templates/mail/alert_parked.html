<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MTGBAN price alerts</title>
</head>
<body style="margin:0; padding:0; background-color:#f3f4f6; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f3f4f6;">
<tr>
<td align="center" style="padding:24px 16px;">
<table role="presentation" width="600" cellpadding="0" cellspacing="0" style="width:600px; max-width:100%; background-color:#ffffff;">
<tr>
<td style="padding:24px 24px 8px 24px;">
<span style="font-size:20px; font-weight:bold; color:#1f2937;">MTGBAN</span>
</td>
</tr>
<tr>
<td style="padding:0 24px 20px 24px;">
<span style="font-size:18px; color:#1f2937;">Your price alerts are paused</span>
</td>
</tr>
{{range .Reasons}}
<tr>
<td style="padding:0 24px 12px 24px; font-size:14px; color:#374151;">{{.}}</td>
</tr>
{{end}}
<tr>
<td style="padding:8px 24px 16px 24px; border-top:1px solid #f3f4f6; font-size:14px; color:#1f2937;">
{{range .Lines}}<div style="padding:2px 0;">{{.}}</div>{{end}}
{{if .More}}<div style="padding:2px 0; color:#6b7280;">and {{.More}} more</div>{{end}}
</td>
</tr>
{{if .AlertsURL}}
<tr>
<td style="padding:0 24px 24px 24px;">
<a href="{{.AlertsURL}}" style="display:inline-block; padding:10px 16px; background-color:#2563eb; color:#ffffff; text-decoration:none; font-size:14px;">Review your alerts</a>
</td>
</tr>
{{end}}
{{if .UnsubscribeURL}}
<tr>
<td style="padding:0 24px 24px 24px; font-size:12px; color:#6b7280;">
<a href="{{.UnsubscribeURL}}" style="color:#6b7280;">Unsubscribe from alert mail</a>
</td>
</tr>
{{end}}
</table>
</td>
</tr>
</table>
</body>
</html>
