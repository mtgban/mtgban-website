name: 'Run CI'

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read no datastore, so they run on their own and
  # report in seconds rather than behind the 400 MB download.
  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.17.1 \
            -set_exit_status -config .revive.toml ./...

      # revive reads the syntax tree; staticcheck follows the values through
      # it. Pinned, since a new release finding new things would fail a build
      # that changed nothing.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2026.2.2 ./...

      # The standard library ships with the toolchain, which Dependabot's
      # go.mod updates do not cover. Not pinned: the verdict follows the
      # vulnerability database, which moves whichever release reads it.
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  build-and-test:
    runs-on: ubuntu-latest
    env:
      # MTGJSON AllPrintings is public, so the URL is inlined here. It used to
      # come from the org-level vars.DATASTORE_MAGIC, but GitHub does not expose
      # variables to pull_request runs from forks (it resolved empty, leaving an
      # empty curl URL and failing every fork PR).
      DATASTORE_URL: https://mtgjson.com/api/v5/AllPrintings.json.xz
      # The userstate and alerts store tests run against the service below,
      # as its default user and database.
      USERSTATE_TEST: 1
      USERSTATE_TEST_USER: postgres
      USERSTATE_TEST_PASSWORD: ""
      USERSTATE_TEST_DB: postgres
      # The observability store tests share that database: no table name or
      # advisory lock class of theirs is one the userstate or alerts tests use.
      OBSERVABILITY_TEST: 1
      OBS_HOST: 127.0.0.1
      OBS_PORT: 5432
      OBS_USER: postgres
      OBS_PASS: ""
      OBS_DB: postgres
    services:
      postgres:
        image: postgres:17
        env:
          # A throwaway server only this job reaches: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # The offline mode tests are javascript and need no datastore, so they
      # run before the 400 MB download the go steps wait on.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: bun test tests/
        run: bun test tests/

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute datastore cache key
        id: ds
        run: |
          etag=$(curl -sI --retry 3 --retry-all-errors "$DATASTORE_URL" | grep -i etag | tr -d '\r"' | cut -f 2 -d " ")
          base=$(basename "$DATASTORE_URL" | cut -d? -f1)
          echo "key=$base-$etag" >> "$GITHUB_OUTPUT"
          echo "filepath=datastore/$base" >> "$GITHUB_OUTPUT"

      - name: Cache datastore
        id: cache
        uses: actions/cache@v6
        with:
          path: "datastore/"
          key: ${{ steps.ds.outputs.key }}

      - name: Download datastore (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p datastore/
          curl -L --fail --retry 3 --retry-all-errors "$DATASTORE_URL" -o "${{ steps.ds.outputs.filepath }}"

      - name: Decompress datastore
        run: xz -dc "${{ steps.ds.outputs.filepath }}" > allprintings5.json

      # The other games' datastores sit in a private bucket, so a run with no
      # secrets, as a fork's or Dependabot's pull request is, tests Magic alone:
      # the tests skip a game whose variable is unset.
      - name: Download the other games' datastores
        env:
          B2_APPLICATION_KEY_ID: ${{ secrets.B2_APPLICATION_KEY_ID_DATASTORE }}
          B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY_DATASTORE }}
        run: |
          if [ -z "$B2_APPLICATION_KEY" ]; then
            echo "::notice::no datastore secrets on this run, testing Magic alone"
            exit 0
          fi
          pipx install b2
          mkdir -p game-datastores/
          for game in lorcana riftbound onepiece pokemon yugioh fleshandblood gundam palworld; do
            b2 file download --no-progress "b2://mtgban-datastore/$game/$game.json.xz" "game-datastores/$game.json.xz"
            xz -d "game-datastores/$game.json.xz"
            echo "$(echo "$game" | tr '[:lower:]' '[:upper:]')_PATH=$PWD/game-datastores/$game.json" >> "$GITHUB_ENV"
          done
          # A red run states which datastore bytes it tested against
          sha256sum game-datastores/*.json

      - name: go build ./...
        run: go build ./...

      - name: go test ./...
        run: go test ./...
