name: 'Run CI'

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  # Formatting, vet and lint read no datastore, so they run on their own and
  # report in seconds rather than behind the 400 MB download.
  style:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -s -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet ./...
        run: go vet ./...

      - name: Lint
        run: |
          go run github.com/mgechev/revive@v1.13.0 \
            -set_exit_status -config .revive.toml ./...

      # revive reads the syntax tree; staticcheck follows the values through
      # it. Pinned, since a new release finding new things would fail a build
      # that changed nothing.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...

  build-and-test:
    runs-on: ubuntu-latest
    env:
      # MTGJSON AllPrintings is public, so the URL is inlined here. It used to
      # come from the org-level vars.DATASTORE_MAGIC, but GitHub does not expose
      # variables to pull_request runs from forks (it resolved empty, leaving an
      # empty curl URL and failing every fork PR).
      DATASTORE_URL: https://mtgjson.com/api/v5/AllPrintings.json.xz
    steps:
      - uses: actions/checkout@v6

      # The offline mode tests are javascript and need no datastore, so they
      # run before the 400 MB download the go steps wait on.
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: bun test tests/
        run: bun test tests/

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Compute datastore cache key
        id: ds
        run: |
          etag=$(curl -sI "$DATASTORE_URL" | grep -i etag | tr -d '\r"' | cut -f 2 -d " ")
          base=$(basename "$DATASTORE_URL" | cut -d? -f1)
          echo "key=$base-$etag" >> "$GITHUB_OUTPUT"
          echo "filepath=datastore/$base" >> "$GITHUB_OUTPUT"

      - name: Cache datastore
        id: cache
        uses: actions/cache@v5
        with:
          path: "datastore/"
          key: ${{ steps.ds.outputs.key }}

      - name: Download datastore (cache miss)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p datastore/
          curl -L "$DATASTORE_URL" -o "${{ steps.ds.outputs.filepath }}"

      - name: Decompress datastore
        run: xz -dc "${{ steps.ds.outputs.filepath }}" > allprintings5.json

      - name: go build ./...
        run: go build ./...

      - name: go test ./...
        run: go test ./...
