name: pokemon-deploy

on:
  push:
    tags:
      - 'v*'
      - 'pokemon-*'
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag/branch to deploy"
        required: true
      skip_ci:
        description: "Deploy without checking that CI passed"
        type: boolean
        default: false

# One deploy of a game at a time; a newer one waits for the running one.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false
  queue: max

permissions: {}

jobs:
  ci:
    uses: ./.github/workflows/ci-passed.yml
    with:
      ref: ${{ github.event.inputs.ref || github.ref_name }}
      skip: ${{ inputs.skip_ci == true }}
    permissions:
      actions: read
      contents: read

  deploy:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to droplet over SSH
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.DROPLET_HOST_POKEMON }}
          username: ${{ secrets.DROPLET_SSH_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            REF="${{ github.event.inputs.ref || github.ref_name }}"
            # Update the control repo so we run this ref's deploy.sh. Nothing
            # serves from this dir — it's just the orchestrator; the script
            # checks out and builds the per-port runtime checkouts itself.
            cd /home/${{ secrets.DROPLET_SSH_USER }}/src/mtgban-website
            git fetch --force --prune --tags origin "$REF"
            git checkout --force FETCH_HEAD
            deploy/deploy.sh "$REF"
