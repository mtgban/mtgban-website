name: lorcana-deploy

on:
  push:
    tags:
      - 'v*'
      - 'lorcana-*'
  workflow_dispatch:

permissions: {}

jobs:
  newest:
    uses: ./.github/workflows/newest-tag.yml
    permissions:
      contents: read
    with:
      tags: 'v* lorcana-*'

  deploy:
    needs: newest
    if: needs.newest.outputs.deploy == 'true'
    # One deploy at a time: two at once race on the same host or app.
    concurrency:
      group: ${{ github.workflow }}
    runs-on: ubuntu-latest
    steps:
      - name: Install doctl
        uses: digitalocean/action-doctl@v2.5.2
        with:
          token: ${{ secrets.DO_API_TOKEN }}

      - name: Create deployment
        run: doctl apps create-deployment ${{ secrets.DO_LORCANA_APP_ID }} --wait

